nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/aice09/discourse
  tag: "0.0.0-unverified"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Image entrypoints are intentionally explicit. They must match the
# validated image contract before production deployment.
web:
  enabled: true
  replicas: 3
  command: []
  args: []
  port: 3000
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 4Gi }
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 2
  env: []

sidekiq:
  enabled: true
  replicas: 2
  command: []
  args: []
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 4Gi }
  pdb:
    enabled: true
    minAvailable: 1
  env: []

discourse:
  hostname: forum.phlopentech.org
  title: PHLOPENTECH Community
  environment: production
  existingSecret: discourse-secrets
  secretKeys:
    railsSecret: rails-secret
  extraEnvFrom: []
  extraEnv: []

database:
  enabled: true
  # postgresql | cloudnative-pg | external
  provider: postgresql

  postgresql:
    image: postgres:16.6
    replicas: 1
    database: discourse
    username: discourse
    existingSecret: discourse-postgresql-credentials
    passwordKey: password
    storage:
      enabled: true
      storageClass: ceph-rbd-infra-k8s
      size: 100Gi
    resources:
      requests: { cpu: "2", memory: 4Gi }
      limits: { cpu: "4", memory: 8Gi }
    servicePort: 5432
    args: []
    backup:
      enabled: false
      # Configure an external backup solution for standard PostgreSQL.
      notes: "Use pgBackRest, WAL-G or a tested pg_dump workflow."

  cloudnativepg:
    operatorRequired: true
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:16.6
    database: discourse
    owner: discourse
    existingSecret: discourse-postgresql-credentials
    passwordKey: password
    storage:
      storageClass: ceph-rbd-infra-k8s
      size: 100Gi
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "8", memory: 16Gi }
    backup:
      enabled: false
      destinationPath: ""
      retentionPolicy: 30d

  external:
    host: ""
    port: 5432
    database: discourse
    username: discourse
    existingSecret: ""
    passwordKey: password
    sslMode: require

redis:
  # standalone | external
  provider: standalone
  standalone:
    image: redis:7.4.2
    existingSecret: discourse-redis-credentials
    passwordKey: password
    storage:
      enabled: true
      storageClass: ceph-rbd-infra-k8s
      size: 20Gi
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: "2", memory: 4Gi }
  external:
    host: ""
    port: 6379
    database: 0
    existingSecret: ""
    passwordKey: password
    tls: false

uploads:
  # existing-pvc | s3
  backend: existing-pvc
  existingClaim: discourse-uploads
  mountPath: /shared
  s3:
    enabled: false
    bucket: ""
    region: ""
    endpoint: ""
    existingSecret: ""

service:
  type: ClusterIP
  port: 80

networking:
  # ingress | gateway-api | disabled
  mode: ingress
  ingress:
    className: ""
    annotations: {}
    hosts:
      - host: forum.phlopentech.org
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: discourse-tls
  gateway:
    parentRefs: []
    hostnames:
      - forum.phlopentech.org
    path:
      type: PathPrefix
      value: /
    sectionName: ""
    filters: []
    tls:
      enabled: false
      certificateRefs: []

certManager:
  enabled: false
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - forum.phlopentech.org

migration:
  enabled: false
  # Enable only after the image's migration command is validated.
  command: []
  args: []
  existingSecret: discourse-secrets
  backoffLimit: 3
  activeDeadlineSeconds: 1800

backup:
  enabled: false
  schedule: "0 2 * * *"
  timezone: Asia/Manila
  image: alpine:3.21
  command: []
  args: []
  existingSecret: discourse-backup-credentials
  retentionDays: 30

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    groups: []

networkPolicy:
  enabled: false
  ingressFrom: []
  egressTo: []

podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraObjects: []

{{- if eq .Values.redis.provider "standalone" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "discourse.fullname" . }}-redis
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "discourse.fullname" . }}-redis
spec:
  serviceName: {{ include "discourse.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.standalone.image | quote }}
          ports:
            - name: redis
              containerPort: 6379
          args:
            - --appendonly
            - "yes"
            - --requirepass
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.standalone.existingSecret }}
                  key: {{ .Values.redis.standalone.passwordKey }}
          resources:
            {{- toYaml .Values.redis.standalone.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.redis.standalone.storage.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.redis.standalone.storage.size }}
{{- end }}

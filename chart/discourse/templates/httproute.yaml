{{- if eq .Values.networking.mode "gateway-api" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "discourse.fullname" . }}
spec:
  parentRefs:
    {{- toYaml .Values.networking.gateway.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.networking.gateway.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: {{ .Values.networking.gateway.path.type }}
            value: {{ .Values.networking.gateway.path.value | quote }}
      {{- with .Values.networking.gateway.filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ include "discourse.fullname" . }}-web
          port: {{ .Values.service.port }}
{{- end }}

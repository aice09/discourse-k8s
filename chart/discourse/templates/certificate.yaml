{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "discourse.fullname" . }}-tls
spec:
  secretName: {{ .Values.networking.ingress.tls.secretName }}
  issuerRef:
    name: {{ .Values.certManager.issuerRef.name }}
    kind: {{ .Values.certManager.issuerRef.kind }}
  dnsNames:
    {{- toYaml .Values.certManager.dnsNames | nindent 4 }}
{{- end }}

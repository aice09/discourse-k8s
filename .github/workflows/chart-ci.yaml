name: Helm chart CI
on:
  pull_request:
    paths:
      - "chart/**"
      - "deploy/**"
      - ".github/workflows/chart-ci.yaml"
  push:
    branches: [main]
    paths:
      - "chart/**"
      - "deploy/**"

permissions:
  contents: read

jobs:
  lint-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint
        run: helm lint chart/discourse
      - name: Render default production values
        run: helm template discourse chart/discourse -f deploy/production/values.yaml > rendered.yaml
      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered.yaml

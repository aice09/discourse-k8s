{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "discourse.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.migration.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.migration.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "discourse.fullname" . }}-runtime
            - secretRef:
                name: {{ .Values.migration.existingSecret }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.uploads.mountPath }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.uploads.existingClaim }}
{{- end }}

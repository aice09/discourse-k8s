{{- if .Values.sidekiq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "discourse.fullname" . }}-sidekiq
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: sidekiq
spec:
  replicas: {{ .Values.sidekiq.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: sidekiq
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: sidekiq
    spec:
      imagePullSecrets:
        {{- toYaml .Values.image.pullSecrets | nindent 8 }}
      containers:
        - name: sidekiq
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.sidekiq.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.sidekiq.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "discourse.fullname" . }}-runtime
            - secretRef:
                name: {{ .Values.discourse.existingSecret }}
          env:
            {{- toYaml .Values.sidekiq.env | nindent 12 }}
          resources:
            {{- toYaml .Values.sidekiq.resources | nindent 12 }}
          volumeMounts:
            - name: uploads
              mountPath: {{ .Values.uploads.mountPath }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.uploads.existingClaim }}
{{- end }}

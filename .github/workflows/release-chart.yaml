name: Release Helm chart to GHCR and Artifact Hub
on:
  push:
    tags:
      - "chart-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Chart semver, e.g. 0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: oras-project/setup-oras@v1
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#chart-v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Update chart version
        run: |
          sed -i 's/^version:.*/version: "${{ steps.version.outputs.value }}"/' chart/discourse/Chart.yaml
          sed -i 's/^appVersion:.*/appVersion: "${{ steps.version.outputs.value }}"/' chart/discourse/Chart.yaml
      - name: Lint and package
        run: |
          helm lint chart/discourse
          mkdir -p dist
          helm package chart/discourse --destination dist
      - name: Login to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push OCI chart
        env:
          OWNER: ${{ github.repository_owner }}
        run: helm push dist/discourse-${{ steps.version.outputs.value }}.tgz "oci://ghcr.io/${OWNER}/charts"
      - name: Publish Artifact Hub repository metadata
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/${OWNER}/charts/discourse:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

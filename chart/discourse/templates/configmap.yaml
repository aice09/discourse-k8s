apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "discourse.fullname" . }}-runtime
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
data:
  DISCOURSE_HOSTNAME: {{ .Values.discourse.hostname | quote }}
  DISCOURSE_ENV: {{ .Values.discourse.environment | quote }}
  DISCOURSE_DB_HOST: {{ include "discourse.dbHost" . | quote }}
  DISCOURSE_DB_PORT: {{ ternary "5432" (printf "%v" .Values.database.external.port) (ne .Values.database.provider "external") | quote }}
  DISCOURSE_DB_NAME: {{ ternary .Values.database.postgresql.database .Values.database.external.database (ne .Values.database.provider "external") | quote }}
  DISCOURSE_DB_USERNAME: {{ ternary .Values.database.postgresql.username .Values.database.external.username (ne .Values.database.provider "external") | quote }}
  DISCOURSE_REDIS_HOST: {{ include "discourse.redisHost" . | quote }}
  DISCOURSE_REDIS_PORT: {{ ternary "6379" (printf "%v" .Values.redis.external.port) (eq .Values.redis.provider "standalone") | quote }}
  DISCOURSE_REDIS_DB: {{ .Values.redis.external.database | quote }}

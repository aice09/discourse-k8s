apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discourse
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aice09/discourse-k8s.git
    targetRevision: main
    path: chart/discourse
    helm:
      valueFiles:
        - ../../deploy/production/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: discourse
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

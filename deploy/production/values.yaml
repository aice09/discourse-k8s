image:
  repository: ghcr.io/aice09/discourse
  tag: "v2026.10.0-05445c3bf999"
  pullPolicy: IfNotPresent

discourse:
  hostname: forum.phlopentech.org
  title: PHLOPENTECH Community
  existingSecret: discourse-secrets

web:
  replicas: 3
  command: ["/usr/local/bin/discourse-entrypoint"]
  args: ["web"]
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

sidekiq:
  replicas: 2
  command: ["/usr/local/bin/discourse-entrypoint"]
  args: ["sidekiq"]

database:
  provider: postgresql
  postgresql:
    storage:
      storageClass: ceph-rbd-infra-k8s
      size: 100Gi

redis:
  provider: standalone
  standalone:
    storage:
      storageClass: ceph-rbd-infra-k8s
      size: 20Gi

uploads:
  backend: existing-pvc
  existingClaim: discourse-uploads
  mountPath: /shared

networking:
  mode: ingress
  ingress:
    className: ""
    hosts:
      - host: forum.phlopentech.org
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: discourse-tls

certManager:
  enabled: true
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - forum.phlopentech.org

migration:
  enabled: true
  command: ["/usr/local/bin/discourse-entrypoint"]
  args: ["migrate"]
